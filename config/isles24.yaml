# ISLES'24 training set: perfusion-volume extractor and technical demonstration node
# (plan: docs/registrations/v2_imaging_plan.md). Fixed before the data are downloaded.
#
# The extractor turns a case's perfusion maps into the optional future columns of the partner
# template (config/future.yaml). None of these values is a model input.

dataset:
  name: "ISLES'24 training set"
  record: "https://zenodo.org/records/16748089/latest"
  downloaded: "version v7 (record 17652035, 20 Nov 2025), train.7z MD5 4959a5dd2438d53e3c86d6858484e781, checked 28 Nov 2026"
  licence: "CC BY-NC-SA 4.0"
  software_label: "ISLES'24 maps"                        # written to ctp_software

extractor:
  tmax_threshold_s: 6.0          # hypoperfusion: Tmax > 6 s
  tmax_unit_factor: 1.0          # multiplies the Tmax map to get seconds; checked on the value ranges in step 1
  rcbf_threshold: 0.30           # core: relative CBF < 30 % ...
  core_requires_tmax: true       # ... inside the Tmax > 6 s region
  reference_tmax_below_s: 4.0    # reference CBF: median CBF of valid voxels with Tmax < 4 s
  min_reference_voxels: 1000     # fewer -> core not computed (missing)
  tmax_valid_range_s: [0.0, 30.0]  # outside, or not finite, or CBF <= 0: voxel not valid tissue
  min_cluster_ml: 0.5            # sensitivity analysis only: drop connected clusters smaller than this

agreement:                       # Aim A: automated core against the follow-up infarct (ses-0002)
  bootstrap: 2000
  seed: 2026
  usable_if_spearman_at_least: 0.5   # pre-specified; below it the extractor is not offered to centres

# File patterns inside the BIDS tree (case-insensitive substrings; the first match is used).
files:
  tmax: ["tmax"]
  cbf: ["cbf"]
  followup_lesion: ["lesion-msk", "lesion_msk", "msk"]   # searched only in ses-0002
  demographics: ["demographic_baseline"]
  outcome: ["outcome"]

# Clinical table -> MTOP template (plan, section 5). Fixed on 28 November 2026 from the column
# names and missing counts printed by step 1 (148 cases with clinical tables; no missing values
# reported), before any value or outcome was read. Each key lists the ISLES'24 column name.
# Left unmapped because the name alone does not fix their meaning or unit:
#   Sex (coding not stated), Glucose (mg/dL or mmol/L), Referral and In-House (admission route),
#   Anticoagulation and PAIs (would need a derived three-level category), Onset to door and
#   Door to groin (a derived onset-to-puncture time, units not stated), Wake-up.
# Not template predictors: Center, Leucocytes, CRP, INR, Alert to door, Door to imaging,
#   Door to first series, Time of intervention, Door to recanalization, mRS at admission,
#   mRS 24h, NIHSS discharge, mRS discharge.
mapping_status: fixed
mapping_fixed_on: "2026-11-28"
mapping:
  age: ["Age"]
  mrs_pre: ["mRS premorbid"]
  nihss_adm: ["NIHSS at admission"]
  arrhythmia: ["Atrial fibrillation"]
  htn: ["Hypertension"]
  dm: ["Diabetes"]
  hld: ["Hyperlipidemia"]
  statin: ["Lipid lowering drugs"]
  tici: ["TICI postinterventional"]
  nihss_24h: ["NIHSS 24h"]
  mrs90: ["mRS 3 months"]
